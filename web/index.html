<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfbfc">
  <meta name="description" content="Rill は、チャンネルとスレッドで会話できる Rust 製のオープンソース・チームチャットです。">
  <meta property="og:title" content="Rill — チームチャット">
  <meta property="og:description" content="チームの会話をチャンネル、スレッド、DM にまとめる、Rust 製のチャット。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/river.png">
  <link rel="canonical" href="/">
  <link rel="icon" type="image/svg+xml" href="/mark.svg">
  <script src="/appearance.js"></script>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
  <title>Rill — チームチャット</title>
</head>
<body>
  <a class="skip" href="#timeline">会話へ移動</a>
  <div id="shell">
    <aside id="sidebar" aria-label="ワークスペースナビゲーション">
      <div class="brand-row">
        <div class="wordmark"><img src="/mark.svg" alt="" width="32" height="32"><span>rill</span></div>
        <button id="nav-close" class="icon-button mobile-only" aria-label="ナビゲーションを閉じる" data-icon="x"></button>
      </div>
      <div class="workspace-card">
        <div class="workspace-symbol" aria-hidden="true" data-icon="layers"></div>
        <div class="workspace-text"><strong id="workspace-name">Rill</strong><span id="workspace-caption">ワークスペース</span></div>
      </div>
      <div class="nav-scroll">
        <section class="nav-section">
          <div class="nav-label"><h2>チャンネル</h2><button id="new-channel" class="icon-button" data-icon="plus" aria-label="チャンネルを作成"></button></div>
          <nav id="channels" aria-label="チャンネル"></nav>
        </section>
        <section class="nav-section">
          <div class="nav-label"><h2>ダイレクトメッセージ</h2><button id="new-dm" class="icon-button" data-icon="plus" aria-label="DM を開始"></button></div>
          <nav id="dms" aria-label="ダイレクトメッセージ"></nav>
        </section>
      </div>
      <div class="sidebar-bottom">
        <button id="team-action" class="team-button"><span data-icon="user-plus"></span><span>チームで使う</span></button>
        <button id="account" class="account-row"><span id="self-avatar"></span><span class="account-text"><strong id="self-name">ゲスト</strong><small id="self-detail">ログイン</small></span><span class="account-chevron" data-icon="chevrons"></span></button>
      </div>
    </aside>
    <button id="nav-shade" class="shade" aria-label="ナビゲーションを閉じる" hidden></button>
    <main id="main">
      <header id="topbar">
        <button id="nav-open" class="icon-button mobile-only" data-icon="menu" aria-label="ナビゲーションを開く"></button>
        <div class="breadcrumb"><span data-icon="layout"></span><span id="crumb-workspace"></span><span id="preview-tag" hidden>デモ</span><span class="crumb-separator">/</span><b id="crumb-section">チャンネル</b></div>
        <button id="search-open" class="search-trigger" aria-label="ワークスペースを検索"><span data-icon="search"></span><span>ワークスペースを検索</span><kbd>⌘ K</kbd></button>
        <label class="appearance-control" title="画面の配色">
          <span class="appearance-symbol" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></span>
          <select id="appearance" aria-label="画面の配色">
            <option value="light">ライト</option>
            <option value="dim">ダーク</option>
            <option value="device">端末に合わせる</option>
          </select>
          <span data-icon="down" class="appearance-chevron"></span>
        </label>
        <button id="product" class="icon-button about-button" data-icon="info" aria-label="Rill について・共有"></button>
      </header>
      <div id="panes">
        <section id="conversation" aria-labelledby="room-name">
          <header id="room-header">
            <div class="room-ident"><span id="room-kind" aria-hidden="true">#</span><div class="room-text"><h1 id="room-name">Rill</h1><p id="room-topic"></p></div></div>
            <button id="panel-toggle" class="icon-button" data-icon="panel" aria-label="チャンネル情報" aria-expanded="true"></button>
          </header>
          <div id="timeline" tabindex="-1" aria-label="メッセージ履歴">
            <button id="load-older" class="text-button" hidden>以前のメッセージを読む</button>
            <div id="messages"></div>
          </div>
          <div id="composer-region"></div>
        </section>
        <aside id="context-panel" aria-label="会話の詳細" hidden></aside>
      </div>
    </main>
  </div>
  <dialog id="dialog"><div id="dialog-body"></div></dialog>
  <div id="toast" aria-live="polite" role="status" hidden></div>
  <noscript>Rill を利用するにはブラウザの JavaScript を有効にしてください。</noscript>
</body>
</html>
