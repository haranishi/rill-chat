name: Release
run-name: Release ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: Cargo version with a v prefix, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the release version and main CI
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          package_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          test "$VERSION" = "v$package_version"
          if git show-ref --quiet --verify "refs/tags/$VERSION"; then
            echo "This version already has a Git tag." >&2
            exit 1
          fi
          count=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f event=push -f branch=main -f head_sha="$GITHUB_SHA" -f status=success --jq '.total_count')
          if [[ "$count" -lt 1 ]]; then
            echo "Wait for CI to pass on the selected main revision." >&2
            exit 1
          fi

  amd64:
    needs: check
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      runner: ubuntu-24.04
      platform: linux/amd64
  arm64:
    needs: check
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      runner: ubuntu-24.04-arm
      platform: linux/arm64

  publish:
    needs: [amd64, arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Assemble the two tested images
        id: manifest
        env:
          AMD: ${{ needs.amd64.outputs.digest }}
          ARM: ${{ needs.arm64.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$VERSION" --metadata-file "$RUNNER_TEMP/index.json" "$image@$AMD" "$image@$ARM"
          digest=$(jq -er '."containerimage.descriptor".digest | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/index.json")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          jq -n --arg version "$VERSION" --arg commit "$GITHUB_SHA" --arg digest "$digest" --arg image "$image" \
            '{version:$version,commit:$commit,digest:$digest,image:$image}' > "$RUNNER_TEMP/rill-image.json"
      - name: Attest the release digest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Exercise the production rollout on this disposable runner
        env:
          IMAGE: ${{ steps.manifest.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" --deny-self-hosted-runners \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA"
          docker run --detach --name rill-production --label io.rill.managed=production \
            --mount type=volume,src=rill-production-data,dst=/data -p 127.0.0.1:3847:3847 "$IMAGE:$VERSION"
          curl --retry 15 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:3847/healthz
          docker exec rill-production sh -ec 'echo ok > /data/rollout-probe'
          bash deploy/rollout.sh "$IMAGE@$DIGEST"
          first=$(docker inspect --format '{{.Id}}' rill-production)
          bash deploy/rollout.sh "$IMAGE@$DIGEST"
          test "$first" = "$(docker inspect --format '{{.Id}}' rill-production)"
          docker exec rill-production test -s /data/rollout-probe
          docker run --rm --network none --user 0 --mount type=volume,src=rill-production-backups,dst=/backups,readonly \
            --entrypoint sh "$IMAGE@$DIGEST" -ec 'set -- /backups/*.tar.gz; tar -xOzf "$1" ./rollout-probe | grep -qx ok'
      - name: Publish the release and deployment receipt
        run: |
          gh release create "$VERSION" "$RUNNER_TEMP/rill-image.json" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Rill Chat $VERSION" --generate-notes
