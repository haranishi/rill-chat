name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check the Rust code
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          cargo +stable fmt --all -- --check
          cargo +stable clippy --locked --all-targets -- -D warnings
          cargo +stable test --locked
          cargo +stable build --locked --bin rill-chat
      - name: Test the chat in Chromium
        working-directory: tests
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
          node browser.mjs ../target/debug/rill-chat
      - name: Check live delivery and deployment configuration
        run: |
          node tests/bench.mjs target/debug/rill-chat 20
          bash -n deploy/rollout.sh
          docker compose config --quiet
  container:
    name: Container
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Start the release image and check its health
        run: |
          docker build --tag rill-pr .
          docker run --detach --name rill-smoke -p 127.0.0.1:3847:3847 rill-pr
          curl --retry 15 --retry-delay 1 --retry-connrefused --fail --silent --show-error http://127.0.0.1:3847/healthz
