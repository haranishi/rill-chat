[package]
name = "rill-chat"
version = "0.2.0"
edition = "2024"
build = "src/build.rs"
rust-version = "1.88"
description = "A self-hosted, real-time team chat server with an embedded web client"
license = "MIT"
repository = "https://github.com/haranishi/rill-chat"
publish = false

[dependencies]
argon2 = "0.5.3"
async-stream = "0.3.6"
axum = "0.8.4"
base64 = "0.22.1"
hex = "0.4.3"
include_dir = "0.7.4"
rand = "0.8.5"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "time"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
